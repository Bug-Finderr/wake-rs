[package]
name = "wake-rs"
version = "0.2.1"
edition = "2024"
rust-version = "1.95"
description = "Keep your machine awake from the command line"
license = "MIT"

[[bin]]
name = "wake"
path = "src/main.rs"

[dependencies]
chrono = "0.4.45"
sysinfo = { version = "0.39.5", default-features = false, features = ["system"] }

[target."cfg(unix)".dependencies]
signal-hook = "0.4.4"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
