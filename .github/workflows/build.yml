name: build

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: cargo fmt --check

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: wake-linux-x64
          - os: macos-latest
            artifact: wake-macos-arm64
          - os: windows-latest
            artifact: wake.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --release --locked
      - run: cargo build --release --locked

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: bash tests/smoke_linux.sh target/release/wake

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh tests/smoke_windows.ps1 target/release/wake.exe

      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          set -o pipefail
          state="$(mktemp -d)"
          export WAKE_STATE_DIR="$state"
          trap 'target/release/wake stop >/dev/null 2>&1; rm -rf "$state"' EXIT
          target/release/wake --version | grep -F 'wake '
          target/release/wake --help | grep -F -- '--until-charge N'
          battery_output="$(target/release/wake --until-charge 80 2>&1)" && battery_code=0 || battery_code=$?
          case "$battery_code:$battery_output" in
            0:*"wake: session active"*|\
              0:*"wake: battery already at"*"target 80% reached"*|\
              1:*"wake: cannot parse battery percentage from pmset"*|\
              1:*"wake: cannot parse battery state from pmset"*|\
              1:*"wake: /usr/bin/pmset exited with status"*|\
              2:*"wake: --until-charge 80 is unreachable"*|\
              2:*"wake: cannot determine battery charging direction"*) ;;
            *) printf 'unexpected battery result (exit %s)\n%s\n' "$battery_code" "$battery_output"; exit 1 ;;
          esac
          if printf '%s\n' "$battery_output" | grep -E 'panicked|RUST_BACKTRACE'; then
            echo "unexpected panic output"
            exit 1
          fi
          if [ "$battery_code" -eq 0 ]; then target/release/wake stop >/dev/null; fi
          if target/release/wake --even-lid >even-lid.out 2>&1; then
            echo 'expected the user-owned CI binary to refuse privileged relaunch'
            exit 1
          fi
          grep -F 'root-owned protected install' even-lid.out
          target/release/wake | grep -F 'session active'
          target/release/wake status | grep -F 'session active'
          target/release/wake stop | grep -F 'stopped'

      - name: Stage artifact
        if: github.event_name == 'release'
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/wake.exe "dist/${{ matrix.artifact }}"
          else
            cp target/release/wake "dist/${{ matrix.artifact }}"
          fi

      - name: Upload artifact
        if: github.event_name == 'release'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    if: github.event_name == 'release'
    needs: [build, audit]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
      - name: Attest binaries
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/*/*
      - name: Create checksums
        run: |
          for artifact in dist/*/*; do
            directory="${artifact%/*}"
            name="${artifact##*/}"
            (cd "$directory" && sha256sum "$name" > "$name.sha256")
          done
      - name: Attach binaries and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*/* --clobber
