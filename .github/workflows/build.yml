name: build

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

env:
  RUST_VERSION: 1.97.0

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal --component rustfmt
      - run: cargo +${{ env.RUST_VERSION }} fmt --check

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: wake-linux-x64
          - os: macos-latest
            artifact: wake-macos-arm64
          - os: windows-latest
            artifact: wake.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal --component clippy
      - run: cargo +${{ env.RUST_VERSION }} clippy --all-targets --locked -- -D warnings
      - run: cargo +${{ env.RUST_VERSION }} test --release --locked
      - run: cargo +${{ env.RUST_VERSION }} build --release --locked

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: bash tests/smoke_linux.sh target/release/wake

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh tests/smoke_windows.ps1 target/release/wake.exe

      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          state="$(mktemp -d)"
          export WAKE_STATE_DIR="$state"
          trap 'target/release/wake stop >/dev/null 2>&1; rm -rf "$state"' EXIT
          target/release/wake --version | grep -F 'wake '
          target/release/wake --help | grep -F 'wake --until-charge N'
          target/release/wake 30s | grep -F 'session active'
          target/release/wake status | grep -F 'session active'
          target/release/wake stop | grep -F 'stopped'

      - name: Stage artifact
        if: github.event_name == 'release'
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/wake.exe "dist/${{ matrix.artifact }}"
          else
            cp target/release/wake "dist/${{ matrix.artifact }}"
          fi

      - name: Upload artifact
        if: github.event_name == 'release'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    if: github.event_name == 'release'
    needs: [build, audit]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
      - name: Attest binaries
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/*/*
      - name: Create checksums
        run: |
          for artifact in dist/*/*; do
            directory="${artifact%/*}"
            name="${artifact##*/}"
            (cd "$directory" && sha256sum "$name" > "$name.sha256")
          done
      - name: Attach binaries and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*/* --clobber
