name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  fmt:
    if: github.event_name != 'pull_request' || github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  native:
    needs: fmt
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --release --locked
      - run: cargo build --release --locked
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: bash tests/smoke_linux.sh target/release/wake
      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: bash tests/smoke_macos.sh target/release/wake
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh tests/smoke_windows.ps1 target/release/wake.exe

  msrv:
    if: github.event_name != 'pull_request' || github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
      - run: cargo build --locked

  audit:
    if: github.event_name != 'pull_request' || github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  tag-version:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Require tag to match root package version
        run: |
          metadata="$(cargo metadata --locked --no-deps --format-version 1)"
          root="$(jq -er '.workspace_root' <<<"$metadata")"
          version="$(jq -er --arg manifest "$root/Cargo.toml" '.packages[] | select(.manifest_path == $manifest) | .version' <<<"$metadata")"
          expected="v$version"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "tag $GITHUB_REF_NAME does not match root package version $expected" >&2
            exit 1
          fi

  package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [fmt, native, msrv, audit, tag-version]
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: wake
            artifact: wake-linux-x64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: wake
            artifact: wake-macos-x64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: wake
            artifact: wake-macos-arm64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: wake.exe
            artifact: wake.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Stage release asset
        shell: bash
        run: |
          validate_artifact_name() {
            case "$1" in
              x86_64-unknown-linux-gnu) expected="wake-linux-x64.tar.gz" ;;
              x86_64-apple-darwin) expected="wake-macos-x64.tar.gz" ;;
              aarch64-apple-darwin) expected="wake-macos-arm64.tar.gz" ;;
              x86_64-pc-windows-msvc) expected="wake.exe" ;;
              *) echo "unsupported release target: $1" >&2; return 1 ;;
            esac
            if [ "$2" != "$expected" ]; then
              echo "release target $1 must use artifact $expected, got $2" >&2
              return 1
            fi
          }
          validate_artifact_name "${{ matrix.target }}" "${{ matrix.artifact }}"
          mkdir -p dist
          source="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "$source" "dist/${{ matrix.artifact }}"
          else
            stage="$(mktemp -d)"
            install -m 0755 "$source" "$stage/wake"
            tar -C "$stage" -czf "dist/${{ matrix.artifact }}" wake
            rm -rf "$stage"
          fi
      - name: Smoke test packaged Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh tests/smoke_windows.ps1 dist/wake.exe
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/${{ matrix.artifact }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  linux-package-smoke:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-x86_64-unknown-linux-gnu
          path: package
      - name: Smoke test packaged Linux binary in Debian 12
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work:ro" \
            -v "$GITHUB_WORKSPACE/package:/package:ro" \
            -w /work \
            debian:bookworm \
            bash -c 'mkdir -p /release && tar -xzf /package/wake-linux-x64.tar.gz -C /release && bash tests/smoke_linux.sh /release/wake'

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, linux-package-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Read verified tag notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag_sha="$(gh api "repos/$GH_REPO/git/ref/tags/$GITHUB_REF_NAME" \
            --jq 'select(.object.type == "tag") | .object.sha')"
          test -n "$tag_sha"
          gh api "repos/$GH_REPO/git/tags/$tag_sha" \
            --jq 'select(.verification.verified == true) | .verification.payload' \
            | sed '1,/^$/d' > release-notes.md
          test -s release-notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/*/* --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md
